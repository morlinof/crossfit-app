<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Scheda CrossFit</title>
<meta name="description" content="Importa la scheda CrossFit del coach (Excel o Numbers), registra pesi, score e note ed esporta l’Excel settimanale.">
<meta name="theme-color" content="#eef1f4" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0f1216" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="CrossFit">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/favicon.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="fonts/fonts.css">
<style>
:root { box-sizing: border-box; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
html { scroll-padding-top: env(safe-area-inset-top, 0px); }
body { margin: 0; }
img { max-width: 100%; }
[hidden] { display: none !important; }
</style>
<style>
/* Layout: colonna unica da telefono (max 560px), barra in alto fissa; un giorno = blocchi A, B, C… impilati.
   Arancio = WOD e azioni, blu = forza, verde = fatto. */
:root {
  --bg: #eef1f4;
  --surface: #ffffff;
  --surface-2: #f6f8fa;
  --ink: #131820;
  --muted: #5a6574;
  --line: #d9dfe6;
  --accent: #c2410c;
  --accent-soft: #fbe6da;
  --accent-ink: #ffffff;
  --pct: #1d5bbf;
  --kg: #2a7f3f;
  --rpe: #9a6a00;
  --pct-bg: #e3ecfa;
  --kg-bg: #e2f2e6;
  --rpe-bg: #fbf0d4;
  --warn: #a8500c;
  --warn-bg: #fcefe1;
  --ss: #6a3daf;
  --ss-bg: #efe8fa;
  --shadow: 0 1px 2px rgba(19, 24, 32, .06), 0 4px 14px rgba(19, 24, 32, .05);
  --font-display: "Barlow Condensed", "Arial Narrow", "Helvetica Neue", sans-serif;
  --font-body: "Public Sans", -apple-system, "Segoe UI", Roboto, sans-serif;
  --radius: 14px;
  --fab-track: #3a414c;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1216; --surface: #171b21; --surface-2: #1d2229; --ink: #edf0f3; --muted: #9ba5b2; --line: #2a3039;
    --accent: #ff8a4c; --accent-ink: #1a0b03; --accent-soft: #3a2012;
    --pct: #79a8ff; --kg: #63c97c; --rpe: #f2c04a;
    --pct-bg: #182640; --kg-bg: #15291b; --rpe-bg: #2c2410;
    --warn: #f39d52; --warn-bg: #2c1f12; --ss: #b892f5; --ss-bg: #251c36;
    --shadow: 0 1px 2px rgba(0,0,0,.4);
    --fab-track: #c9cfd6;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1216; --surface: #171b21; --surface-2: #1d2229; --ink: #edf0f3; --muted: #9ba5b2; --line: #2a3039;
  --accent: #ff8a4c; --accent-ink: #1a0b03; --accent-soft: #3a2012;
  --pct: #79a8ff; --kg: #63c97c; --rpe: #f2c04a;
  --pct-bg: #182640; --kg-bg: #15291b; --rpe-bg: #2c2410;
  --warn: #f39d52; --warn-bg: #2c1f12; --ss: #b892f5; --ss-bg: #251c36;
  --shadow: 0 1px 2px rgba(0,0,0,.4);
  --fab-track: #c9cfd6;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 15px;
  line-height: 1.45;
  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
}
button, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.topbar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 10;
  background: color-mix(in srgb, var(--bg) 88%, transparent);
  backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--line);
}
.topbar-inner {
  max-width: 560px; margin: 0 auto; padding: 10px 16px;
  display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 8px; min-height: 52px;
}
.topbar h1 {
  margin: 0; font-family: var(--font-display); font-weight: 700; font-size: 20px;
  letter-spacing: .02em; text-transform: uppercase; text-align: center;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 58vw;
}
.topbar .left { justify-self: start; }
.topbar .right { justify-self: end; }

.link-btn {
  background: none; border: 0; padding: 6px 2px; color: var(--accent); font-weight: 600;
  display: inline-flex; align-items: center; gap: 2px; white-space: nowrap;
}
.link-btn svg { width: 18px; height: 18px; }

main { max-width: 560px; margin: 0 auto; padding-inline: 16px; padding-block: 16px 40px; display: flex; flex-direction: column; gap: 20px; }

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  border-radius: 999px; border: 1px solid transparent; padding: 11px 18px; font-weight: 600;
  min-height: 44px; text-decoration: none;
}
.btn-primary { background: var(--accent); color: var(--accent-ink); }
.btn-ghost { background: var(--surface); border-color: var(--line); }
.btn-danger { background: none; border-color: var(--accent); color: var(--accent); }
.btn-small { min-height: 34px; padding: 6px 14px; font-size: 14px; }
.btn svg { width: 18px; height: 18px; }

.section-label {
  font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted);
  margin: 0 0 8px 4px; display: flex; align-items: center; gap: 6px;
}

.card { background: var(--surface); border-radius: var(--radius); box-shadow: var(--shadow); }
.list { background: var(--surface); border-radius: var(--radius); box-shadow: var(--shadow); overflow: hidden; }
.row {
  display: flex; align-items: center; gap: 12px; width: 100%; text-align: left;
  background: none; border: 0; padding: 14px 16px; border-top: 1px solid var(--line);
}
.list > .row:first-child, .list > :first-child .row:first-child { border-top: 0; }
.row-main { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 6px; }
.row-title { font-weight: 600; }
.row-sub { color: var(--muted); font-size: 13px; }
.chev { color: var(--muted); flex: none; width: 16px; height: 16px; }

.meta { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
.setsreps { font-family: var(--font-display); font-weight: 700; font-size: 19px; letter-spacing: .01em; font-variant-numeric: tabular-nums; margin-right: 2px; }
.chip {
  display: inline-flex; align-items: baseline; gap: 4px; border-radius: 999px; padding: 2px 9px;
  font-weight: 600; font-size: 13px; font-variant-numeric: tabular-nums; white-space: nowrap;
}
.chip small { font-size: 10px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; opacity: .8; }
.chip-percent { background: var(--pct-bg); color: var(--pct); }
.chip-load { background: var(--kg-bg); color: var(--kg); }
.chip-rpe { background: var(--rpe-bg); color: var(--rpe); }
.rest { color: var(--muted); font-size: 13px; display: inline-flex; align-items: center; gap: 3px; }
.rest svg { width: 13px; height: 13px; }
.warn-dot { color: var(--warn); flex: none; width: 18px; height: 18px; }

.ss-tag { color: var(--ss); font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; display: inline-flex; align-items: center; gap: 4px; }
.ss-tag svg { width: 13px; height: 13px; }
.ss-group { border-left: 3px solid var(--ss); }

.issues { background: var(--warn-bg); color: var(--warn); border-radius: 12px; padding: 12px 14px; display: flex; flex-direction: column; gap: 6px; font-size: 14px; font-weight: 500; }
.issues div { display: flex; gap: 8px; align-items: flex-start; }
.issues svg { width: 16px; height: 16px; flex: none; margin-top: 2px; }

.banner { border-radius: 12px; padding: 12px 14px; font-size: 14px; }
.banner-error { background: var(--warn-bg); color: var(--warn); }
.store-note { color: var(--muted); font-size: 12px; text-align: center; }

/* Home */
.hero { display: flex; flex-direction: column; gap: 10px; padding: 8px 4px 0; }
.hero h2 { margin: 0; font-family: var(--font-display); font-weight: 700; font-size: 40px; line-height: 1; text-transform: uppercase; letter-spacing: .01em; text-wrap: balance; }
.hero p { margin: 0; color: var(--muted); max-width: 40ch; }
.steps { display: grid; gap: 10px; padding: 16px; }
.step { display: grid; grid-template-columns: 32px 1fr; gap: 10px; align-items: start; }
.step b { font-family: var(--font-display); font-size: 22px; line-height: 1.1; color: var(--accent); }
.step span { color: var(--muted); font-size: 14px; }
.step strong { display: block; color: var(--ink); font-size: 15px; }
.program-title { font-family: var(--font-display); font-weight: 700; font-size: 22px; text-transform: uppercase; letter-spacing: .01em; line-height: 1.1; }
.import-zone { display: flex; flex-direction: column; gap: 8px; align-items: stretch; }
.file-input { position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none; }
.busy { display: flex; align-items: center; gap: 10px; color: var(--muted); padding: 12px 4px; }
.spinner { width: 18px; height: 18px; border-radius: 50%; border: 2px solid var(--line); border-top-color: var(--accent); animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

/* Review */
.stats { display: grid; grid-template-columns: repeat(3, 1fr); }
.stat { padding: 14px 8px; text-align: center; border-left: 1px solid var(--line); }
.stat:first-child { border-left: 0; }
.stat b { display: block; font-family: var(--font-display); font-size: 30px; line-height: 1; font-variant-numeric: tabular-nums; }
.stat span { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; font-weight: 600; }
.field { display: flex; flex-direction: column; gap: 6px; padding: 12px 16px; border-top: 1px solid var(--line); }
.field:first-child { border-top: 0; }
.field label { font-size: 12px; font-weight: 700; color: var(--muted); letter-spacing: .06em; text-transform: uppercase; }
.field input, .field textarea { border: 1px solid var(--line); border-radius: 10px; background: var(--surface-2); padding: 10px 12px; width: 100%; min-width: 0; font-size: 16px; }
.field textarea { resize: vertical; min-height: 70px; }
.field-grid { display: grid; grid-template-columns: 1fr 1fr; }
.field-grid .field:nth-child(2n) { border-left: 1px solid var(--line); }
.field-grid .field:nth-child(-n+2) { border-top: 0; }
details.week { background: var(--surface); border-radius: var(--radius); box-shadow: var(--shadow); overflow: hidden; }
details.week > summary { list-style: none; padding: 14px 16px; display: flex; align-items: center; justify-content: space-between; gap: 8px; cursor: pointer; font-weight: 600; }
details.week > summary::-webkit-details-marker { display: none; }
details.week > summary .chev { transition: transform .2s; }
details.week[open] > summary .chev { transform: rotate(90deg); }
.session-head { padding: 10px 16px 4px; font-size: 12px; font-weight: 700; color: var(--muted); letter-spacing: .08em; text-transform: uppercase; border-top: 1px solid var(--line); background: var(--surface-2); }
.flag-where { font-size: 12px; color: var(--muted); }

/* Sheet */
.sheet-backdrop { position: fixed; inset: 0; background: rgba(10, 12, 16, .45); z-index: 30; display: flex; align-items: flex-end; justify-content: center; }
.sheet { background: var(--bg); width: 100%; max-width: 560px; max-height: 92%; overflow: auto; border-radius: 18px 18px 0 0; padding: 0 16px calc(24px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 16px; }
.sheet-head { position: sticky; top: 0; background: var(--bg); display: flex; justify-content: space-between; align-items: center; padding: 14px 0 8px; z-index: 1; }
.sheet-head h3 { margin: 0; font-family: var(--font-display); font-size: 20px; text-transform: uppercase; }

/* Program */
.segmented { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; background: var(--surface-2); border: 1px solid var(--line); border-radius: 12px; padding: 3px; gap: 3px; overflow-x: auto; }
.segmented button { border: 0; background: none; border-radius: 9px; padding: 8px 6px; font-weight: 600; color: var(--muted); white-space: nowrap; }
.segmented button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: var(--shadow); }
.session-card { display: flex; gap: 14px; align-items: center; width: 100%; text-align: left; border: 0; padding: 16px; }
.session-num { font-family: var(--font-display); font-weight: 700; font-size: 44px; line-height: .9; color: var(--accent); min-width: 34px; text-align: center; font-variant-numeric: tabular-nums; }
.session-body { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px; }
.session-body .names { color: var(--muted); font-size: 13px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.cards { display: flex; flex-direction: column; gap: 10px; }
.danger-zone { display: flex; flex-direction: column; align-items: center; gap: 10px; padding-top: 10px; }
.danger-zone p { margin: 0; color: var(--muted); font-size: 14px; text-align: center; }
.danger-zone .actions { display: flex; gap: 10px; }

/* Exercise pager */
body.pager-mode main { padding-bottom: calc(110px + env(safe-area-inset-bottom, 0px)); }
.pager { display: flex; overflow-x: auto; scroll-snap-type: x mandatory; gap: 16px; margin-inline: -16px; padding-inline: 16px; scrollbar-width: none; scroll-padding-inline: 16px; }
.pager::-webkit-scrollbar { display: none; }
.ex-card { flex: 0 0 100%; scroll-snap-align: start; padding: 20px 18px; display: flex; flex-direction: column; gap: 18px; min-width: 0; }
.ex-name { margin: 0; font-family: var(--font-display); font-weight: 700; font-size: 34px; line-height: 1; text-transform: uppercase; letter-spacing: .005em; text-wrap: balance; overflow-wrap: anywhere; }
.ex-partners { color: var(--muted); font-size: 14px; margin: 0; }
.ex-big { font-family: var(--font-display); font-weight: 700; font-size: 76px; line-height: .9; font-variant-numeric: tabular-nums; letter-spacing: -.01em; }
.ex-big span { color: var(--muted); font-weight: 600; font-size: 52px; padding-inline: 4px; }
.ex-big-caption { color: var(--muted); font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; margin-top: 6px; }
.chips-lg { display: flex; flex-wrap: wrap; gap: 8px; }
.chips-lg .chip { font-size: 20px; padding: 6px 14px; font-family: var(--font-display); font-weight: 700; letter-spacing: .02em; }
.chips-lg .chip small { font-family: var(--font-body); font-size: 11px; }
.facts { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 10px; }
.fact { background: var(--surface-2); border-radius: 12px; padding: 10px 12px; }
.fact span { display: block; font-size: 11px; font-weight: 700; color: var(--muted); letter-spacing: .08em; text-transform: uppercase; }
.fact b { font-family: var(--font-display); font-size: 26px; font-variant-numeric: tabular-nums; }
.note-card { border-radius: 12px; padding: 12px 14px; background: var(--surface-2); border: 1px solid var(--line); display: flex; flex-direction: column; gap: 4px; }
.note-card h4 { margin: 0; font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); display: flex; align-items: center; gap: 6px; }
.note-card h4 svg { width: 14px; height: 14px; }
.note-card p { margin: 0; }
.note-tip { background: var(--surface); border-left: 3px solid var(--accent); border-top: 0; border-right: 0; border-bottom: 0; }
.pager-bar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 10;
  background: color-mix(in srgb, var(--bg) 92%, transparent);
  backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
  border-top: 1px solid var(--line);
  padding: 10px 16px calc(10px + env(safe-area-inset-bottom, 0px));
}
.pager-bar-inner { max-width: 560px; margin: 0 auto; display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 10px; }
.round-btn { width: 48px; height: 48px; border-radius: 50%; border: 1px solid var(--line); background: var(--surface); display: grid; place-items: center; }
.round-btn svg { width: 22px; height: 22px; }
.round-btn:disabled { opacity: .35; cursor: default; }
.round-btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.next-label { min-width: 0; text-align: center; font-size: 13px; color: var(--muted); }
.next-label b { display: block; color: var(--ink); font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.dots { display: flex; justify-content: center; gap: 5px; }
.dots i { width: 6px; height: 6px; border-radius: 50%; background: var(--line); }
.dots i.on { background: var(--accent); width: 16px; border-radius: 3px; }

/* Registro allenamento */
.log { display: flex; flex-direction: column; gap: 10px; border-top: 1px solid var(--line); padding-top: 16px; }
.log-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.log-head h3 { margin: 0; font-family: var(--font-display); font-weight: 700; font-size: 22px; text-transform: uppercase; letter-spacing: .01em; }
.log-count { font-weight: 600; font-size: 14px; color: var(--muted); font-variant-numeric: tabular-nums; }
.log-count.complete { color: var(--kg); }
.last-time { display: flex; flex-direction: column; gap: 8px; background: var(--surface-2); border-radius: 12px; padding: 10px 12px; }
.lt-head { font-size: 13px; color: var(--muted); }
.lt-head b { display: block; color: var(--ink); font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; }
.lt-sets { display: flex; flex-wrap: wrap; gap: 6px; list-style: none; margin: 0; padding: 0; }
.lt-sets li { display: inline-flex; align-items: baseline; gap: 4px; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 3px 8px; font-family: var(--font-display); font-weight: 700; font-size: 17px; font-variant-numeric: tabular-nums; white-space: nowrap; }
.lt-sets li small { font-family: var(--font-body); font-size: 11px; font-weight: 700; color: var(--muted); }
.lt-sets li .ok { color: var(--kg); }
.lt-sets li .ko { color: var(--accent); }
.lt-sets li.ko-row { border-color: var(--accent); }
.lt-note { margin: 0; font-size: 13px; color: var(--muted); }
.lt-note strong { color: var(--ink); font-weight: 600; }
.set-row { display: grid; grid-template-columns: 26px minmax(0, 1.4fr) minmax(0, 1fr) 44px 44px; gap: 6px; align-items: center; }
.set-n { font-family: var(--font-display); font-weight: 700; font-size: 22px; color: var(--muted); text-align: center; font-variant-numeric: tabular-nums; }
button.set-n { border: 0; background: none; padding: 0; display: grid; place-items: center; height: 48px; color: var(--warn); }
button.set-n svg { width: 18px; height: 18px; }
.set-field { display: flex; align-items: center; gap: 6px; background: var(--surface-2); border: 1px solid var(--line); border-radius: 10px; padding: 0 10px; min-height: 48px; min-width: 0; }
.set-field:focus-within { border-color: var(--accent); }
.set-field input { border: 0; background: none; width: 100%; min-width: 0; padding: 6px 0; font-family: var(--font-display); font-size: 24px; font-weight: 700; font-variant-numeric: tabular-nums; outline: none; }
.set-field input::placeholder { color: var(--muted); opacity: .5; }
.set-field span { color: var(--muted); font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; }
.set-check, .set-miss { width: 44px; height: 48px; border-radius: 12px; border: 2px solid var(--line); background: var(--surface); display: grid; place-items: center; color: var(--muted); }
.set-check svg, .set-miss svg { width: 22px; height: 22px; }
.set-row.done .set-check { background: var(--kg); border-color: var(--kg); color: var(--surface); }
.set-row.done .set-n { color: var(--kg); }
.set-row.missed .set-miss { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.set-row.missed .set-n { color: var(--accent); }
.set-row.missed .set-field input { text-decoration: line-through; text-decoration-thickness: 2px; }
.notes-preview { font-size: 13px; color: var(--muted); background: var(--surface-2); border: 1px dashed var(--line); border-radius: 10px; padding: 8px 10px; font-variant-numeric: tabular-nums; }
.notes-preview b { display: block; font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; margin-bottom: 2px; }
.notes-preview span { color: var(--ink); }
.log-count .miss-count { color: var(--accent); }
.add-set { align-self: flex-start; }
.text-field { display: flex; flex-direction: column; gap: 6px; }
.text-field label { font-size: 12px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.text-field textarea { border: 1px solid var(--line); border-radius: 10px; background: var(--surface-2); padding: 10px 12px; font-size: 16px; min-height: 64px; resize: vertical; width: 100%; }
.text-field textarea:focus { border-color: var(--accent); outline: none; }
.save-status { font-size: 12px; color: var(--muted); font-weight: 600; white-space: nowrap; }
.save-status.error { color: var(--warn); }
.status-badge { font-size: 13px; font-weight: 700; color: var(--muted); font-variant-numeric: tabular-nums; flex: none; }

/* Timer di recupero */
.fact-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.fact-btn { border: 0; border-radius: 999px; background: var(--accent); color: var(--accent-ink); font-weight: 600; font-size: 13px; padding: 6px 12px; display: inline-flex; align-items: center; gap: 4px; }
.fact-btn svg { width: 14px; height: 14px; }
.rt-fab { position: fixed; z-index: 26; width: 58px; height: 58px; border-radius: 50%; border: 0; padding: 0; touch-action: none; user-select: none; -webkit-user-select: none;
  background: conic-gradient(var(--accent) calc(var(--p, 0) * 1%), var(--fab-track) 0); box-shadow: 0 6px 18px rgba(0,0,0,.28); display: grid; place-items: center; cursor: grab; }
.rt-fab-in { width: 48px; height: 48px; border-radius: 50%; background: var(--ink); color: var(--bg); display: grid; place-items: center; font-family: var(--font-display); font-weight: 700; font-size: 18px; font-variant-numeric: tabular-nums; pointer-events: none; }

.rt-fab.snap { transition: left .2s ease, top .2s ease; }

@keyframes rt-pulse { 50% { transform: scale(1.12); } }
.rt-panel { position: fixed; z-index: 25; width: min(340px, calc(100vw - 24px)); }
.rt-card { max-width: 536px; margin: 0 auto; background: var(--ink); color: var(--bg); border-radius: 18px; padding: 12px 14px 14px; box-shadow: 0 10px 30px rgba(0,0,0,.25); display: flex; flex-direction: column; gap: 10px; }

.rt-top { display: flex; justify-content: space-between; align-items: center; gap: 8px; font-size: 12px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; opacity: .85; min-width: 0; }

.rt-main { display: grid; grid-template-columns: 56px 1fr 56px; align-items: center; gap: 8px; }

.rt-bar { height: 4px; border-radius: 2px; background: color-mix(in srgb, currentColor 22%, transparent); overflow: hidden; }

/* Backup */

/* Export */
.export-card { padding: 16px; display: flex; flex-direction: column; gap: 10px; }

/* Data sessione e calendario */
.session-date { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 16px; }

.session-date input[type="date"] { border: 1px solid var(--line); border-radius: 10px; background: var(--surface-2); padding: 8px 10px; font-size: 16px; min-width: 0; max-width: 46%; }

.date-badge { flex: none; width: 46px; text-align: center; display: flex; flex-direction: column; line-height: 1; }
.date-badge b { font-family: var(--font-display); font-size: 26px; font-variant-numeric: tabular-nums; }
.date-badge span { font-size: 11px; font-weight: 700; text-transform: uppercase; color: var(--muted); letter-spacing: .06em; }

@media (prefers-reduced-motion: reduce) {

}
/* --- CrossFit: settimane, giorni, blocchi --- */
.banner-info { background: var(--pct-bg); color: var(--ink); }

<script id="parser">
/* ===== Lettore della scheda CrossFit (Excel esportato da Numbers) =====
   La scheda è una griglia: una riga "Week N", poi righe di blocchi; ogni colonna è un giorno
   (lunedì → sabato) e ogni cella un blocco della giornata, in ordine.
   Il testo del coach resta sempre visibile così com'è; da qui ricavo solo cosa serve per
   registrare: serie e carichi per la forza, score per i WOD, una spunta per il resto. */
var CFParser = (function () {
  var DAY_NAMES = ["Lunedì", "Martedì", "Mercoledì", "Giovedì", "Venerdì", "Sabato", "Domenica"];

  function norm(s) {
    return String(s == null ? "" : s)
      .replace(/\r\n?/g, "\n").replace(/[\u2028\u2029]/g, "\n").replace(/ /g, " ")
      .split("\n").map(function (l) { return l.replace(/\s+$/, ""); }).join("\n")
      .replace(/\n{3,}/g, "\n\n").trim();
  }
  function weekNumber(v) {
    var m = /^\s*(?:week|settimana|sett\.?|w)\s*(\d+)\s*$/i.exec(norm(v));
    return m ? parseInt(m[1], 10) : null;
  }

  // sheets: [{ name, rows: [[testo cella, …], …] }]
  function parse(sheets, fileName) {
    var weeks = [], dayCount = 0;
    sheets.forEach(function (sheet) {
      var rows = sheet.rows || [], headers = [];
      rows.forEach(function (row, r) {
        var n = null;
        (row || []).forEach(function (v) { var w = weekNumber(v); if (w !== null) n = w; });
        if (n !== null) headers.push({ r: r, n: n });
      });
      if (!headers.length) return;
      var cols = {};
      headers.forEach(function (h, i) {
        var end = i + 1 < headers.length ? headers[i + 1].r : rows.length;
        for (var r = h.r + 1; r < end; r++) (rows[r] || []).forEach(function (v, c) { if (norm(v)) cols[c] = true; });
      });
      var dayCols = Object.keys(cols).map(Number).sort(function (a, b) { return a - b; });
      dayCount = Math.max(dayCount, dayCols.length);
      headers.forEach(function (h, i) {
        var end = i + 1 < headers.length ? headers[i + 1].r : rows.length;
        var days = dayCols.map(function (c, d) {
          var blocks = [];
          for (var r = h.r + 1; r < end; r++) {
            var t = norm((rows[r] || [])[c]);
            if (t) blocks.push({ text: t });
          }
          return { day: d, blocks: blocks };
        });
        weeks.push({ number: h.n, days: days });
      });
    });
    if (!weeks.length) throw new Error("Non ho trovato righe \"Week 1\", \"Week 2\"… nel file. Controlla di aver esportato la scheda giusta.");
    if (!weeks.some(function (w) { return w.days.some(function (d) { return d.blocks.length; }); }))
      throw new Error("Ho trovato le settimane ma nessun allenamento dentro.");
    var base = (fileName || "Scheda").replace(/\.(xlsx|xls|numbers)$/i, "").replace(/[_]+/g, " ").replace(/\s+/g, " ").trim();
    return { title: base || "Scheda CrossFit", fileName: fileName || "", dayCount: dayCount, weeks: weeks };
  }

  function dayName(d) { return DAY_NAMES[d] || "Giorno " + (d + 1); }

  /* --- Analisi di un blocco --- */
  var WOD_WORDS = /\b(for\s*time|amrap|emom|e\d+mom|every\s*\d|rounds?\s+of|qualifica|wod|test|tabata|chipper|into)\b/i;
  var SCHEME_AT = /(\d+)\s*[x×]\s*([^@\n]*?)\s*@\s*(\d+(?:[.,]\d+)?(?:\s*[-–]\s*\d+(?:[.,]\d+)?)?\s*%?)/gi;
  var SCHEME_LINE = /^(\d+)\s*[x×]\s*(\d+(?:\s*[-+]\s*\d+)*)\s*$/i;
  var LADDER = /^\d+(?:\s*-\s*\d+){2,}$/;
  var ROUNDS = /^(\d+)\s*[x×]\s*$/i;

  function clean(s) { return s.replace(/\s+/g, " ").trim(); }
  function isNoteLine(l) { return /^\(|^-|facoltativ|obbligatori|scaled|beginner|———|^utilizzare|^\*/i.test(l); }

  function restSeconds(text) {
    var m = /(\d+)\s*['’′](?:\s*(\d+)\s*["”″])?\s*(?:di\s+)?(?:active\s+)?rest|(\d+)\s*["”″]\s*(?:di\s+)?rest|rest\s*(\d+)\s*['’′](?:\s*(\d+)\s*["”″])?/i.exec(text);
    if (!m) return null;
    if (m[1]) return parseInt(m[1], 10) * 60 + (m[2] ? parseInt(m[2], 10) : 0);
    if (m[3]) return parseInt(m[3], 10);
    if (m[4]) return parseInt(m[4], 10) * 60 + (m[5] ? parseInt(m[5], 10) : 0);
    return null;
  }

  function firstLines(lines, n) { return lines.filter(Boolean).slice(0, n); }

  function analyze(text) {
    var lines = text.split("\n").map(function (l) { return clean(l); });
    var nonEmpty = lines.filter(Boolean);
    var rest = restSeconds(text);

    // Titolo breve: prima riga, più la seconda se la prima è solo "5x", "For time"…
    function shortTitle() {
      var f = firstLines(lines, 2);
      var t = f[0] || "";
      if (f[1] && (t.length < 12 || /^(for time|amrap|emom|\d+\s*x)$/i.test(t))) t += " · " + f[1];
      return t.length > 70 ? t.slice(0, 68) + "…" : t;
    }

    // 1) Serie con percentuale: "6x4 @70%", complessi "3x1+4 @50%", più schemi nella stessa riga
    var sets = [], groups = [], firstSchemeLine = -1, m;
    lines.forEach(function (l, i) {
      SCHEME_AT.lastIndex = 0;
      var found = false;
      while ((m = SCHEME_AT.exec(l))) {
        if (/%/.test(m[3]) || !WOD_WORDS.test(text)) {
          found = true;
          groups.push({ count: parseInt(m[1], 10), reps: clean(m[2]), load: clean(m[3]).replace(/\s+/g, "") });
        }
      }
      if (found && firstSchemeLine < 0) firstSchemeLine = i;
    });
    var isWod = WOD_WORDS.test(text);

    // 2) "5x" da solo: un esercizio solo → serie; più esercizi → round di un WOD
    var roundsIdx = -1;
    lines.forEach(function (l, i) { if (roundsIdx < 0 && ROUNDS.test(l)) roundsIdx = i; });
    var roundsMoves = [];
    if (roundsIdx >= 0) {
      for (var i = roundsIdx + 1; i < lines.length; i++) {
        var l = lines[i];
        if (!l) { if (roundsMoves.length) break; else continue; }
        if (/rest|^\(/i.test(l)) break;
        roundsMoves.push(l);
      }
    }

    var em = /(\d+)\s*['’′]\s*e(\d)?\s*mom/i.exec(text);
    if (em) {
      var after = lines.slice(lines.findIndex(function (l) { return /emom/i.test(l); }) + 1).filter(Boolean);
      var mv = after.length === 1 ? /^(\d+)\s+(.+?)\s*@\s*(\d+(?:[.,]\d+)?\s*%)/.exec(after[0]) : null;
      if (mv) {
        var every = parseInt(em[2] || "1", 10);
        return finishSets(clean(mv[2]) + " · EMOM " + em[1] + "’", [{ count: Math.floor(parseInt(em[1], 10) / every), reps: mv[1], load: mv[3].replace(/\s+/g, "") }], 60 * every, text);
      }
    }

    if (!groups.length && !isWod && roundsIdx >= 0 && roundsMoves.length === 1) {
      var n = parseInt(ROUNDS.exec(lines[roundsIdx])[1], 10);
      groups.push({ count: n, reps: "", load: "" });
      return finishSets(roundsMoves[0], groups, rest, text);
    }
    if (isWod || (roundsIdx >= 0 && roundsMoves.length > 1)) {
      return wodInfo(text, lines, shortTitle(), rest, roundsIdx >= 0 ? parseInt(ROUNDS.exec(lines[roundsIdx])[1], 10) : 0);
    }
    if (groups.length) {
      var titleLines = lines.slice(0, firstSchemeLine).filter(function (l) { return l && !isNoteLine(l); });
      var sameLine = clean(lines[firstSchemeLine].replace(SCHEME_AT, ""));
      if (sameLine && !isNoteLine(sameLine)) titleLines.push(sameLine);
      return finishSets(titleLines.join(" ").replace(/\s*\+\s*/g, " + ").replace(/^\+\s*|\s*\+$/g, ""), groups, rest, text);
    }

    // 3) Serie senza percentuale: "4x8", "4x15", scale "15-12-8-4"
    for (var j = 0; j < lines.length; j++) {
      var s = SCHEME_LINE.exec(lines[j]);
      if (s) {
        groups.push({ count: parseInt(s[1], 10), reps: s[2].replace(/\s+/g, ""), load: "" });
        return finishSets(lines.slice(0, j).filter(Boolean).join(" ") || lines[j], groups, rest, text);
      }
      if (LADDER.test(lines[j])) {
        lines[j].split("-").forEach(function (r) { groups.push({ count: 1, reps: r.trim(), load: "" }); });
        return finishSets(lines.slice(0, j).filter(Boolean).join(" ") || lines[j], groups, rest, text);
      }
    }

    // 4) Il resto (skill, complementari, "?"): spunta e note; "Skill 10-15’" ha un conto alla rovescia
    var sk = /^(?:skill|mobility|warm\s*up)\D*(\d+)(?:\s*-\s*(\d+))?\s*['’′]/i.exec(nonEmpty[0] || "");
    var simple = { kind: "simple", title: shortTitle(), rest: rest };
    if (sk) simple.timer = { mode: "countdown", secs: parseInt(sk[2] || sk[1], 10) * 60 };
    return simple;
  }

  /* --- WOD: tipo, timer e punteggio ---
     fortime  For time semplice          → cronometro              → tempo
     parts    For time a parti + riposi  → cronometro a parti      → tempo totale
     rounds   N round + riposo fisso     → cronometro a round      → tempo totale
     ratio    N round, riposo 1:3 / 1:4  → riposo calcolato        → tempo totale
     maxreps  N round con "max rmu"      → cronometro a round      → reps per round
     stations AMRAP a stazioni 30"/30"   → sequenza guidata        → reps totali
     bike     Assault Bike a intervalli  → sequenza guidata        → RPM medi
     amrap    AMRAP N’                   → conto alla rovescia     → round + reps
     emom     EMOM N’                    → bip ogni minuto         → risultato
     every    Every X’ x N               → bip a ogni set          → set completati
     free     Qualifiche, test, team wod → cronometro libero       → risultato */
  function range(n) { var a = []; for (var i = 0; i < n; i++) a.push(i); return a; }
  function fill(n, v) { return range(Math.max(0, n)).map(function () { return v; }); }
  var DUR_ANY = /(\d+)\s*['’′](?:\s*(\d+)\s*["”″])?|(\d+)\s*["”″]/;
  var DUR_START = /^(\d+)\s*['’′](?:\s*(\d+)\s*["”″])?\s*|^(\d+)\s*["”″]\s*|^(\d+)\s*(?:-\s*\d+)?\s*min\b\s*/i;
  function secsOf(m) { return m[1] ? parseInt(m[1], 10) * 60 + (m[2] ? parseInt(m[2], 10) : 0) : parseInt(m[3], 10); }
  function restsOf(lines) {
    var out = [];
    lines.forEach(function (l) {
      if (!/\brest\b|recovery|recupero/i.test(l) || /tra\s+i|total|final|1\s*:\s*\d/i.test(l)) return;
      var m = DUR_ANY.exec(l); if (m) out.push(secsOf(m));
    });
    return out;
  }
  function timedLine(l) {
    var m = DUR_START.exec(l); if (!m) return null;
    var secs = m[4] ? parseInt(m[4], 10) * 60 : secsOf(m);
    var label = clean(l.slice(m[0].length).replace(/^[-–>→\s]+/, "").replace(/^amrap\s+/i, ""));
    return { secs: secs, label: label, rest: /\brest\b|recovery|recupero/i.test(label) };
  }
  // Sequenza di fasi a tempo: "5’ Z1", "8x" + "1’ -> 70 RPM" / "2’ -> 50 RPM", "Cool down 5-8 min Z1"…
  function buildSequence(lines) {
    var segs = [], prefix = "", i = 0, stop = /scalat|donne|beginner|———|^scaled/i;
    var pattern = { pre: [], loop: [], loops: 0, post: [] }, groups = 0;
    segs.grouped = false;
    while (i < lines.length) {
      var l = lines[i];
      if (!l) { i++; continue; }
      if (stop.test(l)) break;
      var rh = ROUNDS.exec(l);
      if (rh) {
        var n = parseInt(rh[1], 10), group = []; i++;
        while (i < lines.length) {
          var l2 = lines[i]; if (!l2) { i++; continue; }
          var tl = timedLine(l2); if (!tl) break;
          group.push(tl); i++;
        }
        if (group.length >= 2) segs.grouped = true;
        if (group.length) { groups++; pattern.loop = group.map(function (g) { return { secs: g.secs, label: g.label || "Lavoro", rest: g.rest }; }); pattern.loops = n; }
        for (var r = 0; r < n; r++) group.forEach(function (g) { segs.push({ secs: g.secs, label: g.label || "Lavoro", rest: g.rest, round: r + 1, rounds: n }); });
        continue;
      }
      var t = timedLine(l);
      if (t) {
        var sg = { secs: t.secs, label: (prefix ? prefix + " · " : "") + (t.label || "Lavoro"), rest: t.rest };
        segs.push(sg); (groups ? pattern.post : pattern.pre).push({ secs: sg.secs, label: sg.label, rest: sg.rest }); prefix = "";
      }
      else if (/cool\s*down|warm\s*up|riscaldamento|defaticamento/i.test(l)) prefix = l.replace(/:$/, "");
      i++;
    }
    var out = segs.slice(0, 300); out.grouped = segs.grouped;
    // con più di un giro diverso lo schema non si può riassumere: lo tengo come elenco di fasi
    out.pattern = groups > 1 ? { pre: out.map(function (x) { return { secs: x.secs, label: x.label, rest: x.rest }; }), loop: [], loops: 0, post: [] } : pattern;
    return out;
  }
  function wodInfo(text, lines, title, rest, rounds) {
    var info = { kind: "wod", title: title, rest: rest, rounds: rounds || 0 }, m;
    var isFT = /for\s*time/i.test(text);
    if ((m = /(\d+)\s*['’′]\s*e(\d)?\s*mom/i.exec(text))) {
      var every = parseInt(m[2] || "1", 10), n = Math.floor(parseInt(m[1], 10) / every);
      info.wodType = "emom"; info.score = "result";
      info.timer = { mode: "sequence", segments: range(n).map(function (i) { return { secs: 60 * every, label: (every > 1 ? "Intervallo " : "Minuto ") + (i + 1), round: i + 1, rounds: n }; }),
        pattern: { pre: [], loop: [{ secs: 60 * every, label: every > 1 ? "Intervallo" : "Minuto" }], loops: n, post: [], numbered: true } };
      return info;
    }
    if ((m = /every\s*(\d+)\s*['’′]\s*x\s*(\d+)/i.exec(text))) {
      var X = parseInt(m[1], 10), K = parseInt(m[2], 10), alt = /altern/i.test(text);
      info.wodType = "every"; info.score = "sets"; info.sets = K;
      info.timer = { mode: "sequence", segments: range(K).map(function (i) { return { secs: X * 60, label: "Set " + (i + 1) + (alt ? " · " + (i % 2 ? "B" : "A") : ""), round: i + 1, rounds: K }; }),
        pattern: { pre: [], loop: [{ secs: X * 60, label: "Set" }], loops: K, post: [], numbered: true, alt: alt } };
      return info;
    }
    var rests = restsOf(lines);
    if ((m = /rest\s*1\s*:\s*(\d+)(?:\s*o\s*1\s*:\s*(\d+))?/i.exec(text))) {
      info.wodType = "ratio"; info.score = "time";
      info.timer = { mode: "parts", parts: rounds || 1, rests: [], ratios: [parseInt(m[1], 10)].concat(m[2] ? [parseInt(m[2], 10)] : []) };
      return info;
    }
    if (rounds && /max\s*(unbkn|unbroken|unbr)|[“"]\s*x\s*[”"]/i.test(text)) {
      var lab = /max\s*(?:unbkn|unbroken|unbr)?\s*([a-z0-9]+)/i.exec(text);
      info.wodType = "maxreps"; info.score = "roundreps"; info.maxLabel = lab ? lab[1].toLowerCase() : "reps";
      info.timer = { mode: "parts", parts: rounds, rests: fill(rounds - 1, rests[0] || 0) };
      return info;
    }
    var seq = isFT ? [] : buildSequence(lines);
    var work = seq.filter(function (x) { return !x.rest; });
    // Sequenza guidata solo se c'è un giro di fasi a tempo ("3x" + 30”/30”…) o almeno 3 fasi di lavoro a tempo
    if (seq.grouped || work.length >= 3) {
      var inRounds = work.filter(function (x) { return x.round; });
      var rpm = [];
      if (inRounds.length && inRounds.every(function (x) { return /\d+\s*rpm/i.test(x.label); }))
        inRounds.forEach(function (x) { var r = parseInt(/(\d+)\s*rpm/i.exec(x.label)[1], 10); if (rpm.indexOf(r) < 0) rpm.push(r); });
      info.wodType = rpm.length ? "bike" : "stations"; info.score = rpm.length ? "rpm" : "reps"; info.rpm = rpm;
      info.timer = { mode: "sequence", segments: seq, pattern: seq.pattern };
      return info;
    }
    if (rounds && rests.length) { info.wodType = "rounds"; info.score = "time"; info.timer = { mode: "parts", parts: rounds, rests: fill(rounds - 1, rests[0]) }; return info; }
    if (isFT && rests.length) { info.wodType = "parts"; info.score = "time"; info.timer = { mode: "parts", parts: rests.length + 1, rests: rests }; return info; }
    if (isFT || /\btest\b|prendere\s*tempo/i.test(text)) { info.wodType = "fortime"; info.score = "time"; info.timer = { mode: "parts", parts: 1, rests: [] }; return info; }
    if ((m = /(\d+)\s*['’′]\s*amrap/i.exec(text))) { info.wodType = "amrap"; info.score = "rounds"; info.timer = { mode: "countdown", secs: parseInt(m[1], 10) * 60 }; return info; }
    if (rounds) { info.wodType = "rounds"; info.score = "time"; info.timer = { mode: "parts", parts: rounds, rests: fill(rounds - 1, 0) }; return info; }
    info.wodType = "free"; info.score = "result"; info.timer = { mode: "parts", parts: 1, rests: [] };
    return info;
  }

  function finishSets(title, groups, rest, text) {
    var sets = [];
    groups.forEach(function (g, gi) {
      for (var k = 0; k < Math.min(g.count, 20); k++) sets.push({ reps: g.reps, load: g.load, group: gi });
    });
    sets = sets.slice(0, 24);
    return { kind: "sets", title: clean(title) || "Forza", groups: groups, sets: sets, rest: rest };
  }

  return { parse: parse, analyze: analyze, dayName: dayName, norm: norm, restSeconds: restSeconds };
})();

</script>

<script id="numbers">
/* ===== Lettura dei file .numbers =====
   SheetJS legge il formato di Numbers, ma rifiuta i fogli con nomi che Excel non ammette
   (per esempio "CHIMERA SEASON 26/27", per via della "/"). Prima di passargli il file,
   apro il pacchetto, decomprimo l'indice del documento e sostituisco quei caratteri nei
   nomi con "-": stessa lunghezza, quindi la struttura del file resta valida.
   Il file originale non viene toccato. */
var NumbersFix = (function () {
  var BAD = { 0x2F: 1, 0x5C: 1, 0x3F: 1, 0x2A: 1, 0x5B: 1, 0x5D: 1, 0x3A: 1 };

  function snappyDecode(src) {
    var p = 0, len = 0, shift = 0, b;
    do { b = src[p++]; len |= (b & 0x7f) << shift; shift += 7; } while (b & 0x80);
    var out = new Uint8Array(len), o = 0;
    while (p < src.length) {
      var tag = src[p++], type = tag & 3, n, off;
      if (type === 0) {
        n = tag >> 2;
        if (n >= 60) { var bytes = n - 59; n = 0; for (var k = 0; k < bytes; k++) n |= src[p++] << (8 * k); }
        n += 1;
        out.set(src.subarray(p, p + n), o); p += n; o += n;
        continue;
      }
      if (type === 1) { n = ((tag >> 2) & 7) + 4; off = ((tag >> 5) << 8) | src[p++]; }
      else if (type === 2) { n = (tag >> 2) + 1; off = src[p] | (src[p + 1] << 8); p += 2; }
      else { n = (tag >> 2) + 1; off = (src[p] | (src[p + 1] << 8) | (src[p + 2] << 16) | (src[p + 3] << 24)) >>> 0; p += 4; }
      for (var i = 0; i < n; i++, o++) out[o] = out[o - off];
    }
    return out;
  }

  // Snappy fatto solo di "letterali": niente compressione, ma è un flusso valido.
  function snappyEncode(data) {
    var parts = [], len = data.length, v = [];
    do { var byte = len & 0x7f; len >>>= 7; v.push(len ? byte | 0x80 : byte); } while (len);
    parts.push(Uint8Array.from(v));
    for (var p = 0; p < data.length; p += 65536) {
      var chunk = data.subarray(p, Math.min(p + 65536, data.length)), n = chunk.length - 1;
      parts.push(n < 60 ? Uint8Array.of(n << 2) : n < 256 ? Uint8Array.of(60 << 2, n) : Uint8Array.of(61 << 2, n & 255, n >> 8));
      parts.push(chunk);
    }
    return concat(parts);
  }

  function concat(parts) {
    var total = parts.reduce(function (a, b) { return a + b.length; }, 0), out = new Uint8Array(total), o = 0;
    parts.forEach(function (x) { out.set(x, o); o += x.length; });
    return out;
  }

  function readIwa(u8) {
    var chunks = [], i = 0;
    while (i < u8.length) {
      var type = u8[i], l = u8[i + 1] | (u8[i + 2] << 8) | (u8[i + 3] << 16);
      if (type !== 0) throw new Error("formato IWA sconosciuto");
      chunks.push(snappyDecode(u8.subarray(i + 4, i + 4 + l)));
      i += 4 + l;
    }
    return chunks;
  }
  function writeIwa(chunks) {
    return concat(chunks.map(function (c) {
      var enc = snappyEncode(c), l = enc.length;
      return concat([Uint8Array.of(0, l & 255, (l >> 8) & 255, (l >> 16) & 255), enc]);
    }));
  }

  // Campi di testo brevi (tag 0x0A = campo 1, il nome nei fogli) con caratteri vietati.
  function patchNames(buf) {
    var changed = 0;
    for (var i = 0; i + 2 < buf.length; i++) {
      if (buf[i] !== 0x0A) continue;
      var L = buf[i + 1];
      if (L < 1 || L > 120 || i + 2 + L > buf.length) continue;
      var ok = true, bad = false, letters = 0;
      for (var k = i + 2; k < i + 2 + L; k++) {
        var c = buf[k];
        if (c < 0x20 || c === 0x7F) { ok = false; break; }
        if (BAD[c]) bad = true;
        if ((c >= 0x41 && c <= 0x5A) || (c >= 0x61 && c <= 0x7A)) letters++;
      }
      if (!ok || !bad || letters < 2) continue;
      for (var k2 = i + 2; k2 < i + 2 + L; k2++) if (BAD[buf[k2]]) { buf[k2] = 0x2D; changed++; }
      i += 1 + L;
    }
    return changed;
  }

  // file: ArrayBuffer del .numbers → ArrayBuffer pronto per SheetJS
  function prepare(JSZip, arrayBuffer) {
    return JSZip.loadAsync(arrayBuffer).then(function (zip) {
      var name = Object.keys(zip.files).find(function (n) { return /(^|\/)Index\/Document\.iwa$/.test(n); });
      if (!name) {
        var inner = Object.keys(zip.files).find(function (n) { return /(^|\/)Index\.zip$/.test(n); });
        if (inner) return zip.file(inner).async("arraybuffer").then(function (b) {
          return prepare(JSZip, b).then(function (fixed) { zip.file(inner, fixed); return zip.generateAsync({ type: "arraybuffer", compression: "STORE" }); });
        });
        return arrayBuffer;
      }
      return zip.file(name).async("uint8array").then(function (u8) {
        var chunks = readIwa(u8), n = 0;
        chunks.forEach(function (c) { n += patchNames(c); });
        if (!n) return arrayBuffer;
        zip.file(name, writeIwa(chunks));
        return zip.generateAsync({ type: "arraybuffer", compression: "STORE" });
      });
    });
  }

  return { prepare: prepare };
})();

</script>

<script id="exporter">
/* ===== Export Excel =====
   Ricostruisce la griglia del coach (una colonna per giorno, i blocchi in ordine) e sotto
   ogni riga di blocchi aggiunge una riga verde con i tuoi risultati. */
var CFExport = (function () {
  var INK = "FF131820", MUTED = "FF5A6574", HEAD = "FF1F2733", HEAD_TEXT = "FFFFFFFF", DAY = "FFE9EDF2", RESULT = "FFE2F2E6", RESULT_TEXT = "FF1E5A2E", LINE = "FFD0D6DE";

  function sheetName(t) { return String(t || "Scheda").replace(/[\\\/?*\[\]:]/g, " ").replace(/\s+/g, " ").trim().slice(0, 31) || "Scheda"; }

  function build(ExcelJS, o) {
    var p = o.program, nDays = Math.max(1, p.dayCount || 6);
    var wb = new ExcelJS.Workbook();
    wb.creator = "Scheda CrossFit"; wb.created = new Date();
    var ws = wb.addWorksheet(sheetName(p.title), { views: [{ state: "frozen", ySplit: 0 }] });
    ws.columns = Array.from({ length: nDays }, function () { return { width: 36 }; });
    var border = { top: { style: "thin", color: { argb: LINE } }, left: { style: "thin", color: { argb: LINE } }, bottom: { style: "thin", color: { argb: LINE } }, right: { style: "thin", color: { argb: LINE } } };
    var r = 1;

    o.weeks.forEach(function (w, wi) {
      if (wi > 0) r++;
      // Riga "Week N"
      ws.mergeCells(r, 1, r, nDays);
      var title = ws.getCell(r, 1);
      title.value = "Week " + w.number;
      title.font = { bold: true, size: 14, color: { argb: HEAD_TEXT } };
      title.alignment = { horizontal: "center", vertical: "middle" };
      title.fill = { type: "pattern", pattern: "solid", fgColor: { argb: HEAD } };
      ws.getRow(r).height = 22;
      r++;
      // Giorni con la data in cui li hai fatti
      for (var d = 0; d < nDays; d++) {
        var c = ws.getCell(r, d + 1), date = o.dateFor(w.number, d);
        c.value = o.dayName(d) + (date ? " · " + date : "");
        c.font = { bold: true, color: { argb: INK } };
        c.fill = { type: "pattern", pattern: "solid", fgColor: { argb: DAY } };
        c.alignment = { horizontal: "center", vertical: "middle" };
        c.border = border;
      }
      r++;
      var maxBlocks = Math.max.apply(null, w.days.map(function (x) { return x.blocks.length; }).concat([0]));
      for (var b = 0; b < maxBlocks; b++) {
        var any = false;
        for (var d2 = 0; d2 < nDays; d2++) {
          var blk = w.days[d2] && w.days[d2].blocks[b];
          var cell = ws.getCell(r, d2 + 1);
          cell.value = blk ? blk.text : "";
          cell.alignment = { wrapText: true, vertical: "top" };
          cell.font = { color: { argb: INK } };
          cell.border = border;
        }
        r++;
        for (var d3 = 0; d3 < nDays; d3++) {
          var blk2 = w.days[d3] && w.days[d3].blocks[b];
          var res = blk2 ? o.resultFor(w.number, d3, b, blk2.text) : "";
          var rc = ws.getCell(r, d3 + 1);
          rc.value = res ? "▶ " + res : "";
          rc.alignment = { wrapText: true, vertical: "top" };
          rc.font = { italic: !res, color: { argb: res ? RESULT_TEXT : MUTED } };
          if (res) { rc.fill = { type: "pattern", pattern: "solid", fgColor: { argb: RESULT } }; any = true; }
          rc.border = border;
        }
        if (!any) ws.getRow(r).height = 8;
        r++;
      }
    });
    return wb.xlsx.writeBuffer();
  }

  return { build: build };
})();

</script>

    // Registro: { entries: { "settimana-giorno-blocco": {...} }, days: { "settimana-giorno": "AAAA-MM-GG" } }
    getLogs: function (id) {

    }
  };

  /* ---------- Stato ---------- */
  var state = {
    view: "home",            // home | review | program | day | calendar
    programs: [], loading: true, busy: false, error: "",
    pending: null,           // scheda letta dall'Excel, in revisione
    updateOf: null,          // id della scheda da aggiornare (re-import)

    calMonth: "", calDay: "", calFrom: "home",
    expanded: {},            // testi del coach aperti per intero
    lastRest: null,          // { secs, label } per il timer

    maxesFrom: "home", maxesStatus: ""

  var app = document.getElementById("app");
  var fileInput = document.getElementById("xlsx-input");
  var backupInput = document.getElementById("backup-input");

  /* ---------- Utilità ---------- */
  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
  function plural(n, one, many) { return n + " " + (n === 1 ? one : many); }
  function pad2(n) { return String(n).padStart(2, "0"); }
  function todayStr() { var d = new Date(); return d.getFullYear() + "-" + pad2(d.getMonth() + 1) + "-" + pad2(d.getDate()); }
  function parseDate(str) { var m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(str || ""); return m ? new Date(+m[1], +m[2] - 1, +m[3]) : null; }
  function fmtDate(str, long) {
    var d = parseDate(str); if (!d) return "";
    var o = long ? { weekday: "long", day: "numeric", month: "long" } : { weekday: "short", day: "numeric", month: "short" };
    if (d.getFullYear() !== new Date().getFullYear()) o.year = "numeric";
    return d.toLocaleDateString("it-IT", o);
  }
  function fmtKg(v) { return String(v).replace(".", ","); }
  function normName(s) { return String(s || "").toLowerCase().replace(/\s+/g, " ").trim(); }
  function restLabel(secs) { var m = Math.floor(secs / 60), s = secs % 60; return m ? m + "’" + (s ? pad2(s) + "”" : "") : s + "”"; }

  var analysisCache = {};
  function analyze(text) { return analysisCache[text] || (analysisCache[text] = P.analyze(text)); }

  function currentProgram() { return state.programs.find(function (p) { return p.id === state.programId; }) || null; }
  function sortedWeeks(p) { return p.weeks.slice().sort(function (a, b) { return a.number - b.number; }); }
  function weekHasContent(w) { return w.days.some(function (d) { return d.blocks.length; }); }
  function currentWeek() { var p = currentProgram(); return p ? sortedWeeks(p)[state.week] || null : null; }
  function currentDay() { var w = currentWeek(); return w ? w.days[state.day] || null : null; }
  function blockKey(wn, d, b) { return wn + "-" + d + "-" + b; }
  function dayKey(wn, d) { return wn + "-" + d; }

  /* ---------- Registro ---------- */
  function logsOf(pid) { return state.logs[pid] || (state.logs[pid] = {}); }
  function datesOf(pid) { return state.dates[pid] || (state.dates[pid] = {}); }
  function getEntry(pid, key, create) {
    var L = logsOf(pid), en = L[key];
    if (!en && create) en = L[key] = { sets: [], score: "", version: "", loads: "", note: "", done: false };
    return en || null;
  }
  function kindOf(a, en) { return (en && en.kind) || a.kind; }
  var FREE_WOD = { wodType: "free", score: "result", timer: { mode: "parts", parts: 1, rests: [] } };
  function wodOf(a) { return a.kind === "wod" ? a : FREE_WOD; }
  var WOD_LABEL = { fortime: "For time", parts: "For time a parti", rounds: "Round con recupero", maxreps: "Round · max reps", ratio: "Round · recupero proporzionale",
    stations: "AMRAP a stazioni", bike: "Assault Bike", amrap: "AMRAP", emom: "EMOM", every: "Every", free: "Cronometro" };
  function hasWodScore(en) {
    return !!(en && ((en.score || "").trim() || (en.rr || []).some(function (x) { return x; }) || (en.rpm && Object.keys(en.rpm).some(function (k) { return en.rpm[k]; }))));
  }
  function setsOf(a, en) {
    var base = a.kind === "sets" ? a.sets : [];
    var n = Math.max(base.length, en && en.sets ? en.sets.length : 0, kindOf(a, en) === "sets" ? 1 : 0);
    var out = [];
    for (var i = 0; i < n; i++) out.push({ plan: base[i] || null, log: (en && en.sets && en.sets[i]) || {} });
    return out;
  }
  function setAt(en, i) { while (en.sets.length <= i) en.sets.push({ kg: "", reps: "", done: false, missed: false }); return en.sets[i]; }
  function attempted(en) { return en && en.sets ? en.sets.filter(function (s) { return s && (s.done || s.missed); }).length : 0; }
  function blockComplete(a, en) {
    if (!en) return false;
    var k = kindOf(a, en);
    if (k === "sets") { var total = Math.max(1, a.kind === "sets" ? a.sets.length : en.sets.length); return attempted(en) >= total; }
    if (k === "wod") return !!(en.done || hasWodScore(en));
    return !!en.done;
  }
  function blockStarted(a, en) {
    if (!en) return false;
    return !!(attempted(en) || (en.sets || []).some(function (s) { return s && s.kg; }) || hasWodScore(en) || en.done || (en.note || "").trim());
  }
  // La prima volta che registri qualcosa in un giorno, la data diventa oggi. Restituisce true se l'ha appena segnata.
  function touchDay(pid, wn, d) { var D = datesOf(pid), k = dayKey(wn, d); if (D[k]) return false; D[k] = todayStr(); return true; }

  // Riepilogo di quello che hai fatto, usato nell'export e nei recap.
  function resultText(a, en) {
    if (!en) return "";
    var k = kindOf(a, en), parts = [];
    if (k === "sets") {
      var s = [];
      (en.sets || []).forEach(function (x, i) {
        if (!x || !(x.kg || x.reps || x.done || x.missed)) return;

        if (x.kg) t += " " + fmtKg(x.kg) + " kg";

        t += x.done ? " ✓" : x.missed ? " ✗" : "";

      if (s.length) parts.push(s.join(" · "));

      var w = [], wa = wodOf(a);
      if (wa.score === "rpm") {
        var rp = (wa.rpm || []).map(function (t) { return en.rpm && en.rpm[t] ? en.rpm[t] + " (obiettivo " + t + ")" : ""; }).filter(Boolean);
        if (rp.length) w.push("RPM medi " + rp.join(", "));
      } else if (wa.score === "roundreps") {
        var rr = (en.rr || []).filter(function (x) { return x !== "" && x != null; });
        if (rr.length) w.push("Max " + (wa.maxLabel || "reps") + " per round " + rr.join("-") + " (tot " + rr.reduce(function (s2, x) { return s2 + (parseFloat(x) || 0); }, 0) + ")");
      }
      if ((en.score || "").trim()) w.push({ time: "Tempo ", rounds: "Score ", reps: "Reps ", sets: "Set ", result: "Score " }[wa.score] + en.score.trim() + (wa.score === "sets" && wa.sets ? "/" + wa.sets : "") || "Score " + en.score.trim());
      if (en.splits && en.splits.length) w.push("round " + en.splits.join(" · "));
      if (en.version) w.push(en.version);
      if ((en.loads || "").trim()) w.push("Carichi " + en.loads.trim());
      if (!w.length && en.done) w.push("Fatto ✓");
      if (w.length) parts.push(w.join(" · "));
    } else if (en.done) parts.push("Fatto ✓");
    if ((en.note || "").trim()) parts.push(en.note.trim());
    return parts.join(" — ");
  }

  // Ultima volta: stesso esercizio di forza (per titolo) o stesso WOD (per testo o prima riga distintiva).
  function lastTime(p, wn, d, b, a, text) {
    var L = logsOf(p.id), D = datesOf(p.id), cur = D[dayKey(wn, d)] || todayStr(), best = null;
    var title = normName(a.title), first = normName(text.split("\n")[0]);
    var generic = /^(for time|\d+\s*x|amrap.*|emom.*|every.*|skill.*|core|\?)$/i.test(first) || first.length < 8;
    p.weeks.forEach(function (w) {
      w.days.forEach(function (day, dd) {
        if (w.number === wn && dd === d) return;
        var date = D[dayKey(w.number, dd)] || "";
        var before = date ? date <= cur : (w.number < wn || (w.number === wn && dd < d));
        if (!before) return;
        day.blocks.forEach(function (blk, bb) {
          var en = L[blockKey(w.number, dd, bb)];
          if (!en || !blockStarted(analyze(blk.text), en)) return;
          var oa = analyze(blk.text), match = false;
          if (a.kind === "sets" && oa.kind === "sets") match = normName(oa.title) === title;
          else if (a.kind === "wod" || a.kind === "simple") match = P.norm(blk.text) === P.norm(text) || (!generic && normName(blk.text.split("\n")[0]) === first);
          if (!match) return;
          var rank = [date, w.number, dd];
          if (!best || rank[0] > best.rank[0] || (rank[0] === best.rank[0] && (rank[1] > best.rank[1] || (rank[1] === best.rank[1] && rank[2] > best.rank[2]))))
            best = { rank: rank, date: date, week: w.number, day: dd, entry: en, a: oa };
        });
      });
    });
    return best;
  }

  /* ---------- Massimali e peso suggerito ---------- */
  var LIFTS = [
    { id: "snatch", name: "Snatch", hint: "snatch e varianti: power, hang, fermi, snatch deadlift, balance" },
    { id: "cj", name: "Clean & Jerk", hint: "complessi clean + jerk, push/split jerk, front squat \"% del c&J\"" },
    { id: "clean", name: "Clean", hint: "clean da solo, front squat \"% RM di clean\"" },
    { id: "bs", name: "Back squat", hint: "back squat, box squat" },
    { id: "fs", name: "Front squat", hint: "front squat (se non indicato diversamente)" },
    { id: "dl", name: "Deadlift", hint: "deadlift" },
    { id: "bench", name: "Bench press", hint: "panca piana" }
  ];
  function liftName(id) { var l = LIFTS.find(function (x) { return x.id === id; }); return l ? l.name : ""; }
  // Abbinamento automatico: prima le indicazioni esplicite del coach ("% del c&J", "RM di clean"), poi il nome
  function autoLift(title, text) {
    var t = normName(text || ""), n = normName(title);
    if (/%\s*del\s*(c\s*&\s*j|clean\s*(&|and)?\s*jerk|slancio)/.test(t)) return "cj";
    if (/(rm|massimale)\s*(di|del)\s*clean/.test(t)) return "clean";
    if (/front\s*squat/.test(n)) return "fs";
    if (/(back|box)\s*squat/.test(n)) return "bs";
    if (/snatch|strappo/.test(n)) return "snatch";
    if (/deadlift|stacco/.test(n)) return "dl";
    if (/bench|panca/.test(n)) return "bench";
    if (/clean/.test(n) && !/jerk|c\s*&\s*j/.test(n)) return "clean";
    if (/jerk|c\s*&\s*j|clean|slancio/.test(n)) return "cj";
    return "";
  }
  function liftFor(a, text) {
    var o = state.maxes.map && state.maxes.map[normName(a.title)];
    if (o !== undefined) return o === "none" ? "" : o;
    return autoLift(a.title, text);
  }
  function maxOf(id) { var v = parseFloat(String(state.maxes[id] || "").replace(",", ".")); return v > 0 ? v : 0; }
  function roundKg(x) { var step = Number(state.maxes.step) || 1; return String(Math.round(Math.round(x / step) * step * 10) / 10); }
  function pcts(load) {
    if (!/%/.test(load || "")) return [];
    return (String(load).match(/\d+(?:[.,]\d+)?/g) || []).map(function (x) { return parseFloat(x.replace(",", ".")); }).filter(function (x) { return x >= 30 && x <= 120; });
  }
  // Peso suggerito per un carico tipo "70%" o "60-65%": ["49"] o ["42", "46"]
  function kgsFor(load, lift) {
    var ps = pcts(load), max = maxOf(lift);
    if (!ps.length || !lift || !max) return null;
    var kgs = ps.map(function (p) { return roundKg(max * p / 100); });
    return kgs.filter(function (k, i) { return kgs.indexOf(k) === i; });
  }
  function hasPercent(a) { return a.kind === "sets" && a.groups.some(function (g) { return pcts(g.load).length; }); }

  function suggestBox(a, text) {
    if (!hasPercent(a)) return "";
    var lift = liftFor(a, text), max = lift ? maxOf(lift) : 0;
    var select = '<select data-lift-for="' + esc(normName(a.title)) + '" aria-label="Massimale su cui calcolare le percentuali">' +
      '<option value="none"' + (!lift ? " selected" : "") + '>Nessuno</option>' +
      LIFTS.map(function (l) { return '<option value="' + l.id + '"' + (lift === l.id ? " selected" : "") + '>' + l.name + (maxOf(l.id) ? " (" + fmtKg(String(maxOf(l.id))) + " kg)" : "") + '</option>'; }).join("") + '</select>';
    if (lift && max) {
      var rows = a.groups.filter(function (g) { return pcts(g.load).length; }).map(function (g) {
        return '<span class="sg-row"><small>' + esc(g.count + "×" + (g.reps || "") + " @" + g.load) + '</small><b>' + esc(kgsFor(g.load, lift).map(fmtKg).join("–")) + ' kg</b></span>';
      });
      return '<div class="suggest"><span class="suggest-label">Peso suggerito</span><div class="sg-rows">' + rows.join("") + '</div>' +
        '<div class="suggest-base">Su ' + esc(liftName(lift).toLowerCase()) + ' ' + esc(fmtKg(String(max))) + ' kg · cambia: ' + select + '</div></div>';
    }
    if (lift) return '<div class="suggest missing"><div class="suggest-base">Per il peso suggerito serve il massimale di <strong>' + esc(liftName(lift)) + '</strong>.</div>' +
      '<button class="btn btn-ghost btn-small" data-action="open-maxes">Inserisci i massimali</button><div class="suggest-base">Calcolato su ' + select + '</div></div>';
    return '<div class="suggest missing"><div class="suggest-base">Su quale massimale calcolo le percentuali? ' + select + '</div></div>';
  }

  // Peso proposto per la serie i: serie prima dello stesso gruppo, poi il massimale, poi l'ultima volta
  function kgPlaceholder(en, i, last, a, text) {
    var plan = a && a.kind === "sets" ? a.sets[i] : null;
    if (en) for (var j = Math.min(i, en.sets.length) - 1; j >= 0; j--) {
      var same = !plan || !a.sets[j] || a.sets[j].group === plan.group;
      if (same && en.sets[j] && en.sets[j].kg) return en.sets[j].kg;
    }
    if (plan) { var k = kgsFor(plan.load, liftFor(a, text)); if (k) return k[0]; }
    if (en) for (var j2 = Math.min(i, en.sets.length) - 1; j2 >= 0; j2--) if (en.sets[j2] && en.sets[j2].kg) return en.sets[j2].kg;
    if (last && last.entry.sets && last.entry.sets[i] && last.entry.sets[i].kg) return last.entry.sets[i].kg;
    return "";
  }

  function maxesCard() {

        '<div class="set-field"><input id="max-' + l.id + '" data-max="' + l.id + '" inputmode="decimal" autocomplete="off" placeholder="—" value="' + esc(state.maxes[l.id] ? fmtKg(state.maxes[l.id]) : "") + '"><span>kg</span></div></div>';

      [0.5, 1, 2.5].map(function (v) { return '<button data-action="max-step" data-v="' + v + '" aria-pressed="' + (step === v) + '">' + fmtKg(String(v)) + ' kg</button>'; }).join("") + '</div></div>';
    h += '<p class="store-note" style="text-align:left;margin:0 4px">Se un blocco viene abbinato al massimale sbagliato, lo cambi dal blocco stesso: la scelta vale per tutti i blocchi con lo stesso nome.</p>';
    return h + '</main>';
  }

  /* ---------- Salvataggio automatico ---------- */
  var saveQueue = {};
  function setSaveStatus(s) {
    state.saveStatus = s;
    var el = document.getElementById("save-status"); if (!el) return;
    el.textContent = { pending: "Modifiche…", saving: "Salvo…", saved: "Salvato", error: "Non salvato" }[s] || "";
    el.classList.toggle("error", s === "error");
  }
  function scheduleSave(pid) {
    var q = saveQueue[pid] || (saveQueue[pid] = {});
    q.dirty = true; setSaveStatus("pending");
    clearTimeout(q.timer); q.timer = setTimeout(function () { flushSave(pid); }, 700);
  }
  function flushSave(pid) {
    var q = saveQueue[pid];
    if (!q || !q.dirty || q.saving) return;
    clearTimeout(q.timer); q.dirty = false; q.saving = true; setSaveStatus("saving");
    store.saveLogs(pid, state.logs[pid] || {}, state.dates[pid] || {}).then(function () {
      q.saving = false; if (q.dirty) flushSave(pid); else setSaveStatus("saved");
    }).catch(function () {
      q.saving = false; q.dirty = true; setSaveStatus("error");
      q.timer = setTimeout(function () { flushSave(pid); }, 4000);
    });
  }
  function flushAll() { Object.keys(saveQueue).forEach(flushSave); }
  function loadLogs(pid) {
    if (state.logsLoaded[pid] || state.logsLoading[pid]) return;
    state.logsLoading[pid] = true;
    function done() { state.logsLoaded[pid] = true; delete state.logsLoading[pid]; if (state.programId === pid || state.view === "calendar") render(); }
    store.getLogs(pid).then(function (r) { state.logs[pid] = r.entries || {}; state.dates[pid] = r.days || {}; done(); })
      .catch(function () { state.logs[pid] = {}; state.dates[pid] = {}; done(); });
  }

  /* ---------- Pezzi riusati ---------- */
  function topbar(left, title, right) {
    return '<header class="topbar"><div class="topbar-inner"><div class="left">' + (left || "") + '</div><h1>' + esc(title) +
      '</h1><div class="right">' + (right || "") + '</div></div></header>';
  }
  function backBtn(action, label) { return '<button class="link-btn" data-action="' + action + '">' + ICON.back + esc(label) + '</button>'; }
  function kindBadge(k) {
    var label = { sets: "Forza", wod: "WOD", simple: "Skill · altro" }[k];
    return '<span class="kind kind-' + k + '">' + label + '</span>';
  }
  function storeNote() {
    if (store.mode === "db") return '<p class="store-note">Le schede sono salvate nel tuo account Claude.</p>';
    if (store.mode === "local") return '<p class="store-note">Le schede sono salvate in questo browser, su questo dispositivo.</p>';
    return "";
  }
  function weekCounts(p, w) {
    var total = 0, done = 0;
    w.days.forEach(function (day, d) {
      day.blocks.forEach(function (b, i) {
        total++;
        if (state.logsLoaded[p.id] && blockComplete(analyze(b.text), getEntry(p.id, blockKey(w.number, d, i), false))) done++;
      });
    });
    return { total: total, done: done };
  }

  /* ---------- Home ---------- */
  function viewHome() {

        '</div>' +
        '<div class="import-zone"><button class="btn btn-primary" data-action="import">' + ICON.plus + 'Importa la scheda</button></div>' +
        '<button class="link-btn" style="align-self:center" data-action="backup-import">Ripristina da un backup</button>';
      if (state.backupPending || state.backupStatus) h += backupCard();
    } else {
      var list = state.programs.slice().sort(function (a, b) { return (b.importedAt || "").localeCompare(a.importedAt || ""); });
      h += '<div><p class="section-label">Le tue schede</p><div class="list">';

          '<div class="row-sub">' + plural(filled, "settimana", "settimane") + ' con allenamenti' + (filled < p.weeks.length ? ' su ' + p.weeks.length : '') + '</div>' +
          (p.updatedAt ? '<div class="row-sub">Aggiornata il ' + esc(new Date(p.updatedAt).toLocaleDateString("it-IT", { day: "numeric", month: "long", year: "numeric" })) + '</div>' : '') +
          '</div>' + ICON.chev + '</button>';
      });

  }

  /* ---------- Revisione import ---------- */
  function viewReview() {
    var p = state.pending, upd = state.updateOf ? state.programs.find(function (x) { return x.id === state.updateOf; }) : null;
    var counts = { sets: 0, wod: 0, simple: 0 }, blocks = 0, days = 0;
    p.weeks.forEach(function (w) { w.days.forEach(function (d) { if (d.blocks.length) days++; d.blocks.forEach(function (b) { blocks++; counts[analyze(b.text).kind]++; }); }); });

    var h = topbar('<button class="link-btn" data-action="cancel-import">Annulla</button>', upd ? "Aggiorna" : "Controlla",

    if (upd) h += '<div class="banner banner-info">Aggiorni <strong>' + esc(upd.title) + '</strong>: le settimane vengono sostituite con quelle del nuovo file. Quello che hai già registrato resta, abbinato a settimana, giorno e posizione del blocco.</div>';
    else h += '<div class="list"><div class="field"><label for="review-title">Nome della scheda</label><input id="review-title" data-bind="title" value="' + esc(p.title) + '"></div></div>';

    h += '<div class="cards">';

      h += '<details class="week"' + (i === 0 ? " open" : "") + '><summary><span>Week ' + w.number + '</span>' + ICON.chev + '</summary>';
      w.days.forEach(function (d) {

        h += '<div class="session-head">' + esc(P.dayName(d.day)) + '</div><div class="review-blocks">';
        d.blocks.forEach(function (b, bi) {
          var a = analyze(b.text);
          h += '<div class="review-block"><span class="blk-letter sm">' + String.fromCharCode(65 + bi) + '</span><div class="row-main"><div class="row-title">' + esc(a.title) + '</div>' +
            '<div class="meta">' + kindBadge(a.kind) + (a.kind === "sets" ? '<span class="row-sub">' + esc(a.groups.map(function (g) { return g.count + "×" + (g.reps || "") + (g.load ? " @" + g.load : ""); }).join(" · ")) + '</span>' : "") + '</div></div></div>';
        });
        h += '</div>';
      });
      h += '</details>';
    });
    h += '</div><p class="store-note" style="text-align:left;margin:0 4px">Se un blocco è riconosciuto male, nel giorno puoi cambiarne il tipo (Forza, WOD, Skill).</p>';
    h += '<button class="btn btn-primary" data-action="save-import">' + (upd ? "Aggiorna la scheda" : "Salva la scheda") + '</button></main>';

  /* ---------- Scheda: settimane e giorni ---------- */
  function viewProgram() {
    var p = currentProgram(); if (!p) { state.view = "home"; return viewHome(); }
    var weeks = sortedWeeks(p);
    if (state.week >= weeks.length) state.week = 0;
    var w = weeks[state.week];
    var h = topbar(backBtn("go-home", "Schede"), p.title, '<button class="link-btn" data-action="open-calendar" aria-label="Calendario">' + ICON.cal + '</button>');
    h += "<main>";
    h += '<div class="week-strip" role="group" aria-label="Settimana">';
    weeks.forEach(function (wk, i) {
      var c = weekCounts(p, wk), full = weekHasContent(wk);
      h += '<button class="week-chip' + (full ? "" : " empty") + (c.total && c.done === c.total ? " complete" : "") + '" data-action="pick-week" data-i="' + i + '" aria-pressed="' + (i === state.week) + '">' +
        '<small>Week</small><b>' + wk.number + '</b></button>';
    });
    h += '</div>';
    if (!weekHasContent(w)) {
      h += '<div class="card empty-week"><div class="row-title">Week ' + w.number + ' non ancora compilata</div>' +
        '<p class="row-sub">Quando il coach ti manda la scheda aggiornata, usa <strong>Aggiorna scheda</strong> qui sotto con il nuovo file (Numbers o Excel): quello che hai già registrato resta.</p></div>';
    } else {
      var D = state.logsLoaded[p.id] ? datesOf(p.id) : {};
      h += '<div><p class="section-label">Week ' + w.number + '</p><div class="cards">';
      w.days.forEach(function (day, d) {
        if (!day.blocks.length) return;
        var done = 0, started = false;
        day.blocks.forEach(function (b, i) {
          var a = analyze(b.text), en = state.logsLoaded[p.id] ? getEntry(p.id, blockKey(w.number, d, i), false) : null;
          if (blockComplete(a, en)) done++;
          if (blockStarted(a, en)) started = true;
        });
        var all = done === day.blocks.length, date = D[dayKey(w.number, d)];
        var info = [];
        if (date) info.push(fmtDate(date));
        if (started) info.push(all ? "completato" : done + " di " + day.blocks.length + " blocchi");
        h += '<button class="card session-card" data-action="open-day" data-i="' + d + '"><div class="day-tag">' + esc(P.dayName(d).slice(0, 3)) + '</div>' +
          '<div class="session-body"><div class="row-title">' + esc(P.dayName(d)) + ' <span class="row-sub">· ' + plural(day.blocks.length, "blocco", "blocchi") + '</span></div>' +
          '<div class="names">' + esc(day.blocks.map(function (b, i) { return String.fromCharCode(65 + i) + " " + analyze(b.text).title; }).join(" · ")) + '</div>' +
          (info.length ? '<div class="session-progress">' + esc(info.join(" · ").replace(/^./, function (c) { return c.toUpperCase(); })) + '</div>' : '') +
          '</div>' + (all ? ICON.checkCircle : ICON.chev) + '</button>';
      });
      h += '</div></div>';
    }
    // Export e aggiornamento
    h += '<div class="card export-card"><div><div class="row-title">Excel per il coach</div>' +
      '<div class="row-sub">La griglia della scheda con, sotto ogni blocco, i tuoi risultati: carichi, ✓/✗, score, versione e note.</div></div>' +
      '<div class="actions">' + (weekHasContent(w) ? '<button class="btn btn-primary" data-action="export-week">' + ICON.download + 'Esporta Week ' + w.number + '</button>' : '') +
      '<button class="btn btn-ghost btn-small" data-action="export-all">Tutta la scheda</button></div>' +
      '<p class="export-status ' + (state.exportStatus ? state.exportStatus.kind : "") + '" id="export-status" role="status">' + (state.exportStatus ? esc(state.exportStatus.text) : "") + '</p></div>';
    h += '<div class="card export-card"><div><div class="row-title">Scheda aggiornata dal coach?</div>' +
      '<div class="row-sub">Importa il nuovo file (Numbers o Excel) su questa scheda: arrivano le settimane nuove e i tuoi dati restano.</div></div>' +
      '<div class="actions"><button class="btn btn-ghost btn-small" data-action="update-program">' + ICON.refresh + 'Aggiorna scheda</button></div></div>';
    h += '<div class="danger-zone">';
    h += state.confirmDelete
      ? '<p>Eliminare "' + esc(p.title) + '" e tutto quello che hai registrato? Non si può annullare.</p><div class="actions"><button class="btn btn-ghost btn-small" data-action="cancel-delete">Annulla</button><button class="btn btn-danger btn-small" data-action="confirm-delete">Elimina</button></div>'
      : '<button class="btn btn-ghost btn-small" data-action="ask-delete">Elimina scheda</button>';
    h += '</div></main>';
    return h;
  }

  /* ---------- Giorno: blocchi in ordine ---------- */
  function viewDay() {
    var p = currentProgram(), w = currentWeek(), day = currentDay();
    if (!p || !w || !day) { state.view = "program"; return viewProgram(); }
    var status = { saving: "Salvo…", saved: "Salvato", error: "Non salvato", pending: "Modifiche…" }[state.saveStatus] || "";
    var h = topbar(backBtn("go-program", "Week " + w.number), P.dayName(state.day),
      '<span id="save-status" class="save-status' + (state.saveStatus === "error" ? " error" : "") + '" aria-live="polite">' + status + '</span>');
    h += "<main>";
    if (state.logsLoaded[p.id]) h += dateCard(p, w);
    if (state.block >= day.blocks.length) state.block = 0;
    h += '<div class="block-tabs" role="tablist" aria-label="Blocchi del giorno">' + day.blocks.map(function (b, i) {
      var en = state.logsLoaded[p.id] ? getEntry(p.id, blockKey(w.number, state.day, i), false) : null;
      return '<button role="tab" class="block-tab' + (blockComplete(analyze(b.text), en) ? " done" : "") + '" data-action="go-block" data-i="' + i + '" aria-selected="' + (i === state.block) + '">' + String.fromCharCode(65 + i) + '</button>';
    }).join("") + '</div>';
    h += '<div class="pager" id="pager" aria-label="Blocchi del giorno">';
    day.blocks.forEach(function (b, i) { h += blockCard(p, w, state.day, i, b); });
    h += '</div>';
    // Giorno precedente / successivo della settimana
    var prev = -1, next = -1;
    for (var d = state.day - 1; d >= 0; d--) if (w.days[d].blocks.length) { prev = d; break; }
    for (var d2 = state.day + 1; d2 < w.days.length; d2++) if (w.days[d2].blocks.length) { next = d2; break; }
    h += '<div class="day-nav">' +
      (prev >= 0 ? '<button class="btn btn-ghost btn-small" data-action="open-day" data-i="' + prev + '">' + ICON.prev + esc(P.dayName(prev)) + '</button>' : '<span></span>') +
      (next >= 0 ? '<button class="btn btn-ghost btn-small" data-action="open-day" data-i="' + next + '">' + esc(P.dayName(next)) + ICON.next + '</button>' : '<span></span>') + '</div>';
    h += "</main>";
    h += '<nav class="pager-bar" aria-label="Scorri i blocchi"><div class="pager-bar-inner">' +
      '<button class="round-btn" data-action="prev-block" aria-label="Blocco precedente"' + (state.block === 0 ? " disabled" : "") + '>' + ICON.prev + '</button>' +
      '<div class="next-label" id="next-label">' + nextLabel(p, w, day) + '</div>' +
      '<button class="round-btn primary" data-action="next-block" aria-label="Blocco successivo"' + (state.block >= day.blocks.length - 1 ? " disabled" : "") + '>' + ICON.next + '</button>' +
      '</div></nav>';
    return h;
  }

  function nextLabel(p, w, day) {

  // Scorrimento orizzontale tra i blocchi
  function pagerStep(pager) { var card = pager.querySelector(".block"); return card ? card.offsetWidth + 16 : pager.clientWidth; }

  function blockChanged(initial) {

  // Massimo della settimana precedente nei round "max reps" (la "X" del coach)
