        var section = function (part, title, list) {
          var x = '<div class="we-sec"><div class="we-sec-head"><span>' + title + '</span>' +
            (part === "loop" ? '<div class="we-stepper"><button type="button" data-wt="e-loops" data-d="-1" aria-label="Un giro in meno">−</button><b>' + e.loops + '</b><button type="button" data-wt="e-loops" data-d="1" aria-label="Un giro in più">+</button></div>' : '') + '</div><ol class="we-list">';
          list.forEach(function (sg, i) {
            x += '<li class="' + (sg.rest ? "we-rest" : "we-work") + '"><input class="we-label" data-wi="label" data-part="' + part + '" data-i="' + i + '" autocomplete="off" aria-label="Nome della fase" value="' + esc(sg.label) + '">' +
              '<input class="we-time" data-wi="secs" data-part="' + part + '" data-i="' + i + '" inputmode="text" autocomplete="off" aria-label="Durata" value="' + fmt(sg.secs, true) + '">' +
              '<button type="button" class="we-del" data-wt="e-del" data-part="' + part + '" data-i="' + i + '" aria-label="Togli la fase">×</button></li>';
          });
          return x + '</ol><button type="button" class="we-link" data-wt="e-add" data-part="' + part + '">+ Aggiungi fase</button></div>';
        };
        var hasLoop = e.loop && e.loop.length;
        if ((e.pre && e.pre.length) || !hasLoop) h += section("pre", hasLoop ? "Prima" : "Fasi", e.pre || []);
        if (hasLoop) h += section("loop", (e.numbered ? "Ogni intervallo" : "Giro") + " · ripeti", e.loop);
        if (hasLoop && e.post && e.post.length) h += section("post", "Dopo", e.post);
      }
      if (changedFromSheet()) h += '<button type="button" class="we-link muted" data-wt="e-restore">Ripristina come da scheda</button>';
      return h + '</div>';
    }
    function updateEdit(fn) { fn(S.edit); S.cfg = cfgFrom(S.base.mode, S.edit); render(); }

    /* --- comandi --- */
    function begin() {
      unlock();
      var t = now();
      S.status = "running"; S.startedAt = t; S.pausedTotal = 0; S.lastBeep = null;
      if (S.cfg.mode === "parts") { S.phase = "work"; S.phaseStart = t; S.part = 0; S.workAccum = 0; S.roundAccum = 0; S.partTimes = []; }
      else if (S.cfg.mode === "countdown") S.endAt = t + S.cfg.secs * 1000;
      else { S.idx = 0; S.endAt = t + S.cfg.segments[0].secs * 1000; }
      beepGo(); startClock();
      // salvo le modifiche ai passaggi per la prossima volta (o le tolgo, se è tornato come da scheda)
      var onEdit = S.meta.onEdit, edit = changedFromSheet() ? { mode: S.base.mode, edit: clone(S.edit) } : null;
      if (onEdit) try { onEdit(edit); } catch (e) {}
      render();
    }
    function startClock() { clearInterval(interval); interval = setInterval(tick, 250); keepAwake(true); }
    function pause() {
      var t = now();
      if (S.cfg.mode === "parts" && S.phase === "work") { var d = (t - S.phaseStart) / 1000; S.workAccum += d; S.roundAccum += d; }
      else S.left = remaining();
      S.status = "paused"; S.pausedAt = t;
      stopClock(); render();
    }
    function resume() {
      unlock();
      var t = now();
      S.pausedTotal += t - S.pausedAt;
      if (S.cfg.mode === "parts" && S.phase === "work") S.phaseStart = t;
      else if (S.cfg.mode === "parts") S.restEnd = t + S.left * 1000;
      else S.endAt = t + S.left * 1000;
      S.status = "running"; startClock(); render();
    }
    function finish(at) {
      S.status = "done"; S.doneAt = at || now();
      stopClock(); beepGo();
      // lo score si scrive da solo: tempo totale (round + recuperi) e i tempi dei singoli round
      if (S.meta.onSave && S.cfg.mode === "parts") {
        var splits = S.cfg.parts > 1 ? S.partTimes.map(function (x) { return fmt(x, true); }) : [];
        try { S.meta.onSave(fmt(wallSecs(), true), splits); S.saved = true; } catch (e) {}
      }
      render();
    }
    // Fine della parte/round in corso: parte il recupero (o finisce il WOD)
    function endPart() {
      var t = now(), d = (t - S.phaseStart) / 1000, secs = S.roundAccum + d;
      S.workAccum += d; S.partTimes.push(secs); S.roundAccum = 0;
      if (S.part >= S.cfg.parts - 1) return finish(t);
      var rest = S.cfg.ratios ? Math.round(secs * S.ratio) : (S.cfg.rests[S.part] || 0);
      if (rest > 0) { S.phase = "rest"; S.restEnd = t + rest * 1000; S.restTotal = rest; S.lastBeep = null; }
      else { S.part++; S.phaseStart = t; }
      render();
    }
    function endRest(at) { beepGo(); S.phase = "work"; S.part++; S.phaseStart = at || now(); S.roundAccum = 0; render(); }
    function nextSegment(base) {
      // se il telefono è rimasto spento più fasi, salto in silenzio quelle già finite
      var t = now();
      do {
        S.idx++;
        if (S.idx >= S.cfg.segments.length) return finish(base);
        S.endAt = base + S.cfg.segments[S.idx].secs * 1000; base = S.endAt;
      } while (S.endAt <= t);
      S.lastBeep = null; beepGo(); render();
    }
    function tick() {
      if (!S || S.status !== "running") return stopClock();
      var left;
      if (S.cfg.mode === "parts") {
        if (S.phase === "rest") { left = (S.restEnd - now()) / 1000; countBeeps(left); if (left <= 0) return endRest(S.restEnd); }
      } else {
        left = (S.endAt - now()) / 1000; countBeeps(left);
        if (left <= 0) return S.cfg.mode === "countdown" ? finish(S.endAt) : nextSegment(S.endAt);
      }
      draw();
    }
    function countBeeps(left) {
      var s = Math.ceil(left);
      if (s <= 3 && s >= 1 && S.lastBeep !== s) { S.lastBeep = s; beepCount(); }
    }

    /* --- disegno --- */
    function box() { return S ? document.querySelector('.wt-box[data-wt-key="' + S.key + '"]') : null; }
    function phaseInfo() {
      var c = S.cfg, unit = unitWord();
      if (S.status === "ready") {
        var first = c.mode === "countdown" ? fmt(c.secs) : c.mode === "sequence" ? fmt(c.segments[0].secs) : "0:00";
        return { label: c.mode === "sequence" ? c.segments[0].label : "Pronta?", big: first, sub: summary(), bar: 0 };
      }
      if (c.mode === "parts") {
        var of = c.parts > 1 ? unit + " " + (S.part + 1) + " di " + c.parts : "";
        if (S.status === "done") return { label: "Finito", big: fmt(wallSecs(), true), sub: c.parts > 1 ? "Totale: " + unit.toLowerCase() + " + recuperi" : "Tempo totale", bar: 100 };
        if (S.phase === "rest") {
          var l = remaining();
          return { label: "Recupero", big: fmt(l), sub: "Poi " + unit.toLowerCase() + " " + (S.part + 2) + " · totale " + fmt(wallSecs(), true), rest: true, bar: S.restTotal ? (1 - l / S.restTotal) * 100 : 0 };
        }
        return { label: of || "Lavoro", big: fmt(c.parts > 1 ? roundSecs() : wallSecs(), true), sub: c.parts > 1 ? "Totale " + fmt(wallSecs(), true) : "", bar: c.parts > 1 ? (S.part / c.parts) * 100 : 0 };
      }
      if (c.mode === "countdown") {
        var r = S.status === "done" ? 0 : remaining();
        return { label: S.status === "done" ? "Tempo!" : S.meta.modeLabel, big: fmt(r), sub: "", bar: (1 - r / c.secs) * 100 };
      }
      var segs = c.segments, i = Math.min(S.idx, segs.length - 1), seg = segs[i];
      if (S.status === "done") return { label: "Finito", big: "0:00", sub: "Sequenza completata · " + fmt(wallSecs(), true), bar: 100 };
      var left = remaining(), nx = segs[i + 1];
      var totalLeft = left + segs.slice(i + 1).reduce(function (a, b) { return a + b.secs; }, 0);
      return { label: seg.label, big: fmt(left), rest: !!seg.rest,
        sub: (seg.rounds ? "Giro " + seg.round + " di " + seg.rounds + " · " : "") + "Fase " + (i + 1) + " di " + segs.length + " · mancano " + fmt(totalLeft),
        next: nx ? "Poi: " + nx.label + " " + fmt(nx.secs) : "Ultima fase", bar: (1 - left / seg.secs) * 100 };
    }
    function splitsHtml() {
      var t = S.partTimes || [];
      if (!t.length || S.cfg.mode !== "parts" || S.cfg.parts < 2) return "";
      var u = unitWord().charAt(0), best = Math.min.apply(null, t), worst = Math.max.apply(null, t);
      return '<ol class="wt-split-list">' + t.map(function (x, i) {
        return '<li' + (t.length > 2 && x === best ? ' class="best"' : t.length > 2 && x === worst ? ' class="worst"' : '') + '><small>' + u + (i + 1) + '</small>' + fmt(x, true) + '</li>';
      }).join("") + '</ol>';
    }
    // aggiorna solo i numeri (ogni 1/4 di secondo); se la scheda è stata ridisegnata, rimette il timer
    function draw() {
      var b = box(); if (!b) return;
      var panel = b.querySelector(".wt-panel");
      if (S.open && panel && !panel.querySelector(".wt-in")) return render();
      var p = phaseInfo();
      var live = b.querySelector(".wt-live"); if (live) live.textContent = active() ? (p.rest ? "Rec " : "") + p.big : "";
      if (!S.open || !panel) return;
      var set = function (cls, v) { var el = panel.querySelector(cls); if (el && el.textContent !== v) el.textContent = v; };
      set(".wt-label", p.label); set(".wt-big", p.big); set(".wt-sub", p.sub || ""); set(".wt-next", p.next || "");
      var bar = panel.querySelector(".wt-bar i"); if (bar) bar.style.width = Math.max(0, Math.min(100, p.bar || 0)) + "%";
      var sp = panel.querySelector(".wt-splits"), n = String((S.partTimes || []).length);
      if (sp && sp.getAttribute("data-n") !== n) { sp.innerHTML = splitsHtml(); sp.setAttribute("data-n", n); }
      var inn = panel.querySelector(".wt-in"); if (inn) inn.classList.toggle("is-rest", !!p.rest);
    }
    function buttons() {
      var c = S.cfg, b = [];
      if (S.status === "ready") b.push('<button type="button" class="wt-main" data-wt="start">Avvia</button>');
      else if (S.status === "running") {
        if (c.mode === "parts" && S.phase === "work") b.push('<button type="button" class="wt-main" data-wt="part">' + (S.part >= c.parts - 1 ? "Finito!" : "Fine " + unitWord().toLowerCase() + " " + (S.part + 1)) + '</button>');
        else if (c.mode === "parts") b.push('<button type="button" class="wt-main ghost" data-wt="skip">Salta recupero</button>');
        else if (c.mode === "sequence") b.push('<button type="button" class="wt-main ghost" data-wt="skipseg">Salta fase</button>');
        b.push('<button type="button" class="wt-sec" data-wt="pause">Pausa</button>');
      } else if (S.status === "paused") b.push('<button type="button" class="wt-main" data-wt="resume">Riprendi</button><button type="button" class="wt-sec" data-wt="reset">Azzera</button>');
      else b.push('<button type="button" class="wt-sec" data-wt="reset">Ricomincia</button>');
      return '<div class="wt-actions' + (b.length > 1 ? " two" : "") + '">' + b.join("") + '</div>';
    }
    function render() {
      // tutte le tendine: aperta solo quella del timer attivo
      document.querySelectorAll(".wt-box").forEach(function (bx) {
        var mine = S && bx.getAttribute("data-wt-key") === S.key, open = !!(mine && S.open) || (blocked === bx.getAttribute("data-wt-key"));
        bx.classList.toggle("open", open);
        bx.classList.toggle("running", !!(mine && active()));
        var btn = bx.querySelector(".wt-launch"); if (btn) btn.setAttribute("aria-expanded", String(open));
        var panel = bx.querySelector(".wt-panel"); if (!panel) return;
        if (!open) { if (panel.firstChild) panel.innerHTML = ""; var lv = bx.querySelector(".wt-live"); if (lv && !mine) lv.textContent = ""; return; }
        if (!mine) { // c'è già un altro timer in corso
          panel.innerHTML = '<div class="wt-in"><p class="wt-note">C\'è già un timer in corso su <b>' + esc(S ? S.meta.title || "un altro blocco" : "") + '</b>.</p>' +
            '<div class="wt-actions two"><button type="button" class="wt-main" data-wt="takeover">Fermalo e usa questo</button><button type="button" class="wt-sec" data-wt="keep">Lascialo andare</button></div></div>';
          return;
        }
        panel.innerHTML = '<div class="wt-in">' +
          '<div class="wt-label"></div><div class="wt-big" aria-live="off"></div><div class="wt-sub"></div>' +
          (S.status === "ready" ? "" : '<div class="wt-bar" aria-hidden="true"><i></i></div><div class="wt-next"></div><div class="wt-splits"></div>') +
          (S.status === "done" && S.saved ? '<p class="wt-note">Salvato nello score' + (S.cfg.parts > 1 ? ', con i tempi dei round' : '') + '.</p>' : '') +
          buttons() +
          (S.status === "ready" ? '<div class="we-title">Passaggi · tocca un tempo per cambiarlo</div>' + editorHtml() : '') + '</div>';
      });
      if (S) draw();
    }

    /* --- apertura e chiusura dalla scheda --- */
    // base: il timer come da scheda; meta: { key, title, wodType, modeLabel, saved, onEdit, onSave }
    function toggle(base, meta) {
      if (blocked === meta.key) { blocked = null; render(); return; }
      if (S && S.key === meta.key) {
        if (S.open) { S.open = false; if (!active()) { stopClock(); S = null; } }
        else { S.open = true; S.meta = meta; }
        render(); return;
      }
      if (active()) { blocked = meta.key; render(); return; }
      create(base, meta); render();
    }
    function create(base, meta, keepEdit) {
      stopClock();
      var edit;
      try { edit = keepEdit || (meta.saved && meta.saved.mode === base.mode ? clone(meta.saved.edit) : editFrom(base)); cfgFrom(base.mode, edit); }
      catch (e) { edit = editFrom(base); }
      S = { key: meta.key, base: base, edit: edit, cfg: cfgFrom(base.mode, edit), meta: meta, status: "ready", open: true,
        workAccum: 0, roundAccum: 0, partTimes: [], part: 0, phase: "work", ratio: edit.ratios ? edit.ratios[0] : 0, pausedTotal: 0, idx: 0 };
      blocked = null;
    }

    document.addEventListener("click", function (ev) {
      var el = ev.target.closest("[data-wt]"); if (!el || !el.closest(".wt-panel")) return;
      var a = el.getAttribute("data-wt");
      if (a === "keep") { blocked = null; render(); return; }
      if (a === "takeover") {
        var bx = el.closest(".wt-box"), btn = bx && bx.querySelector(".wt-launch");
        stopClock(); S = null; blocked = null; render();
        if (btn) btn.click(); // riapre questo blocco con i suoi dati
        return;
      }
      if (!S) return;
      ev.preventDefault();
      if (a === "ratio") { S.ratio = Number(el.dataset.r); render(); return; }
      if (a === "e-rounds") return updateEdit(function (e) {
        var n = Math.max(1, Math.min(50, (e.rounds || 1) + Number(el.dataset.d)));
        e.rests = e.rests || [];
        while (e.rests.length < n - 1) e.rests.push(e.rests.length ? e.rests[e.rests.length - 1] : 60);
        e.rounds = n; e.rests = e.rests.slice(0, n - 1);
      });
      if (a === "e-loops") return updateEdit(function (e) { e.loops = Math.max(1, Math.min(60, (e.loops || 1) + Number(el.dataset.d))); });
      if (a === "e-del") return updateEdit(function (e) { e[el.dataset.part].splice(Number(el.dataset.i), 1); });
      if (a === "e-add") return updateEdit(function (e) {
        var list = e[el.dataset.part] = e[el.dataset.part] || [], last = list[list.length - 1];
        list.push({ secs: last ? last.secs : 60, label: last && !last.rest ? "Rest" : "Lavoro", rest: !!(last && !last.rest) });
        if (el.dataset.part === "loop" && !e.loops) e.loops = 1;
      });
      if (a === "e-restore") return updateEdit(function (e) { var f = editFrom(S.base); Object.keys(e).forEach(function (k) { delete e[k]; }); Object.assign(e, f); });
      if (a === "start") return begin();
      if (a === "pause") return pause();
      if (a === "resume") return resume();
      if (a === "part") return endPart();
      if (a === "skip") return endRest();
      if (a === "skipseg") return nextSegment(now());
      if (a === "reset") { create(S.base, S.meta, S.edit); render(); return; }
    });
    // campi dei passaggi: i nomi si aggiornano mentre scrivi, i tempi quando confermi
    document.addEventListener("input", function (ev) {
      var t = ev.target; if (!S || S.status !== "ready" || t.dataset.wi !== "label" || !t.closest(".wt-panel")) return;
      var list = S.edit[t.dataset.part], sg = list && list[Number(t.dataset.i)]; if (!sg) return;
      sg.label = t.value; sg.rest = isRestLabel(t.value);
      S.cfg = cfgFrom(S.base.mode, S.edit);
      var li = t.closest("li"); if (li) li.className = sg.rest ? "we-rest" : "we-work";
    });
    document.addEventListener("change", function (ev) {
      var t = ev.target; if (!S || S.status !== "ready" || !t.dataset.wi || t.dataset.wi === "label" || !t.closest(".wt-panel")) return;
      var v = parseTime(t.value), e = S.edit, mode = S.base.mode, i = Number(t.dataset.i), cur;
      if (mode === "parts") { if (v != null) { e.rests = cfgFrom("parts", e).rests; e.rests[i] = v; } cur = cfgFrom("parts", e).rests[i]; }
      else if (mode === "countdown") { if (v != null) e.secs = v; cur = e.secs; }
      else { var sg = e[t.dataset.part] && e[t.dataset.part][i]; if (!sg) return; if (v != null) sg.secs = v; cur = sg.secs; }
      S.cfg = cfgFrom(mode, e);
      // Non ridisegno tutto (si perderebbe il tocco sul pulsante successivo): aggiorno il campo e il riepilogo
      t.value = fmt(cur, true);
      draw();
      var b = box(), we = b && b.querySelector(".we");
      if (we && changedFromSheet() && !we.querySelector('[data-wt="e-restore"]')) we.insertAdjacentHTML("beforeend", '<button type="button" class="we-link muted" data-wt="e-restore">Ripristina come da scheda</button>');
    });
    document.addEventListener("visibilitychange", function () {
      if (document.visibilityState === "visible" && S && S.status === "running") { keepAwake(true); unlock(); tick(); }
    });

    // da chiamare dopo che la pagina ridisegna i blocchi
    function mount() { try { render(); } catch (e) {} }
    function isOpen(key) { return !!(S && S.key === key && S.open) || blocked === key; }
    return { toggle: toggle, mount: mount, isOpen: isOpen, effective: effective };
  })();

  /* ---------- Avvio ---------- */
  render();
  store.init().then(function () {
    return store.getMaxes().then(function (m) { state.maxes = Object.assign({ snatch: "", cj: "", clean: "", bs: "", fs: "", dl: "", bench: "", step: 1, map: {} }, m || {}); })
      .catch(function () {}).then(function () { return store.list(); });
  }).then(function (list) { state.programs = list; state.loading = false; render(); })
    .catch(function () { state.loading = false; render(); });
})();

</script>

<script>
/* Funzionamento offline: il service worker tiene in memoria la pagina, le librerie e i font. */
if ("serviceWorker" in navigator && (location.protocol === "https:" || location.hostname === "localhost")) {
  window.addEventListener("load", function () { navigator.serviceWorker.register("sw.js").catch(function () {}); });
}
</script>
</body>
